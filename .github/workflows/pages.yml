# Builds the application and deploys to Github Pages
name: Pages Build and Deploy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node 🧰
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install and Build 🔧
        run: |
          # npm 10 (bundled with Node 20) hits a non-deterministic ERESOLVE
          # failure roughly 1 in 4 runs on a fresh install, tracing to how
          # its arborist peer-conflict resolver applies the workspace-scoped
          # `overrides` entry needed for apps/v17's react-markdown@4 (see
          # package.json). npm >=11 resolves it reliably every time - run
          # the install itself through a one-off npx-fetched copy rather
          # than replacing the runner's global npm.
          npx --yes npm@11 install
          npm run build:v17
          npm run build:v18
          npm run build:v19

      - name: Assemble deploy tree 📦
        # Combines the static landing page (deployed at the site root) with
        # each app's build (deployed under /v17, /v18, /v19) into one tree.
        # v18/v19 are built and deployed here so their tracks are reachable
        # by direct URL, but the landing page doesn't link to them yet -
        # they aren't "activated" until their own tracks are ready to show.
        run: |
          mkdir -p site
          cp -r landing/. site/
          mkdir -p site/v17 site/v18 site/v19
          cp -r apps/v17/build/. site/v17/
          cp -r apps/v18/build/. site/v18/
          cp -r apps/v19/build/. site/v19/

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: docs # The branch the action should deploy to.
          folder: site # The folder the action should deploy.
          clean: true # Automatically remove deleted files from the deploy branch
