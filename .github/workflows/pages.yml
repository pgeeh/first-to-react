# Builds the application and deploys to Github Pages
name: Pages Build and Deploy

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node 🧰
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install and Build 🔧
        run: |
          npm install
          npm run build:v17

      - name: Assemble deploy tree 📦
        # Combines the static landing page (deployed at the site root) with
        # v17's build (deployed under /v17) into one tree. v18/v19 aren't
        # built or deployed here yet - they aren't linked from the landing
        # page until their own tracks are ready to show.
        run: |
          mkdir -p site
          cp -r landing/. site/
          mkdir -p site/v17
          cp -r apps/v17/build/. site/v17/

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: docs # The branch the action should deploy to.
          folder: site # The folder the action should deploy.
          clean: true # Automatically remove deleted files from the deploy branch
